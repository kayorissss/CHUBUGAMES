name: Build CHUBUGAMES APK

# СБОРКА И ПУБЛИКАЦИЯ РАЗДЕЛЕНЫ ПО СМЫСЛУ.
#
# Раньше релиз перезаписывался на ЛЮБОМ пуше в main/master/arena/**: любая
# экспериментальная ветка выкатывала боевой APK, а каждая ошибка в такой ветке
# означала битую ссылку скачивания для всех. Плюс фильтры веток разъехались с
# реальностью: основная ветка репозитория называется CHUBUGAMES, её в списке не
# было вовсе, и пуш в неё не собирал ничего.
#
# Теперь: пуш/PR = проверка и артефакт; релиз = тег v<версия> (или ручной запуск
# с флагом publish). Так «выпустить версию» — это отдельное осознанное действие.
on:
  push:
    branches: [CHUBUGAMES, main, master, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить APK в Releases (требует секретов подписи)"
        type: boolean
        default: false

# Релизный job пишет в Releases — ему нужен токен. Проверочный job
# (verify) прав на запись не получает вообще.
permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────  ПРОВЕРКА  ─────────────────────────
  # Дёшево и быстро: типы, сборка и 230+ договорённостей по вёрстке.
  # Ни Android SDK, ни Java здесь не нужны.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci, а не npm install: сборка должна быть воспроизводимой
      # по package-lock.json — мы раздаём бинарники пользователям.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # vite типы НЕ проверяет: без этого шага ошибка типов спокойно
      # доезжала до релиза, потому что сборка всё равно проходила.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web app (single offline HTML)
        run: npm run build

      # check:ui читает dist/index.html, поэтому строго после сборки
      - name: UI contract checks
        run: npm run check:ui
      # логика производительности и ввода: без браузера, по заглушкам DOM
      - name: Performance & input logic checks
        run: npm run check:perf

      # Ключ подписи не имеет права вернуться в репозиторий
      - name: No signing key in the repo
        run: |
          if git ls-files | grep -qE '\.(p12|jks|keystore)$'; then
            echo "В git лежит ключ подписи — удалите его и перенесите в Secrets:"
            git ls-files | grep -E '\.(p12|jks|keystore)$'
            exit 1
          fi
          echo "ключа в репозитории нет — ок"

      - name: Version is consistent
        run: |
          node -e "
            const fs=require('fs');
            const app=fs.readFileSync('src/core/version.ts','utf8').match(/APP_VERSION\s*=\s*\"([0-9.]+)\"/)[1];
            const pkg=JSON.parse(fs.readFileSync('package.json','utf8')).version;
            if(app!==pkg){ console.error('APP_VERSION='+app+', а в package.json='+pkg); process.exit(1); }
            console.log('версия '+app+' совпадает в обоих местах');
          "

  # ─────────────────────────  APK  ─────────────────────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ПК-версии в APK нет, а electron тянет ~100 МБ бинарника —
      # пропускаем его загрузку, сборка Android от этого не зависит.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build web app (single offline HTML)
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Capacitor 7 -> compileSdk 35 / AGP 8.7.2 (Capacitor 8 требует SDK 36 и падает на раннере)
      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # capacitor.config.json лежит в репозитории (там настройки фоновой
      # проверки обновлений), поэтому cap init больше не нужен — он бы упал
      # с ошибкой «config already exists».
      - name: Check Capacitor config
        run: cat capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android app (portrait, offline)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Игра портретная
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' $MANIFEST
          # Вибрация для хаптики
          sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          # Установка обновлений прямо из приложения
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' $MANIFEST
          # Интернет нужен ТОЛЬКО для скачивания обновления; сами игры работают офлайн
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          # Уведомление о новой версии, когда игра закрыта (Android 13+)
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          # Фоновая проверка должна пережить перезагрузку телефона
          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST
          echo "--- AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Read app version
        run: |
          VER=$(node -p "require('fs').readFileSync('src/core/version.ts','utf8').match(/APP_VERSION\s*=\s*\"([0-9.]+)\"/)[1]")
          echo "APP_VER=$VER" >> $GITHUB_ENV
          echo "Версия приложения: $VER (сборка ${{ github.run_number }})"

      # На релизном прогоне тег обязан совпадать с версией в коде: иначе
      # «v1.25.0» соберётся из кода, который помнит 1.24.0, и приложение
      # решит, что обновление уже установлено.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$APP_VER" ]; then
            echo "Тег v$TAG, а в src/core/version.ts — $APP_VER"; exit 1
          fi
          echo "тег и версия совпадают: $APP_VER"

      # Релиз = тег v* или ручной запуск с галкой publish.
      - name: Decide what this run is
        id: kind
        run: |
          REL=false
          case "$GITHUB_REF" in
            refs/tags/v*) REL=true ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            REL=true
          fi
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "Режим: $([ "$REL" = true ] && echo 'РЕЛИЗ (публикация в Releases)' || echo 'проверка (только артефакт)')"

      # Стеклянная полоска внизу экрана живёт в WebView, а системные панели
      # Android красит шаблон Capacitor. Правим его цвета и просим систему
      # не рисовать свою подложку под статус-баром (см. скрипт).
      - name: Match Android system bars to the glass
        run: node scripts/patch-android-glass.mjs android/app/src/main/res

      - name: Install app icons
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            cp -v android-icons/mipmap-$d/*.png $RES/mipmap-$d/
          done

          # фон adaptive-иконки: белый -> тёмный, под стиль приложения
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#0D0D10</color>' \
            '</resources>' \
            > $RES/values/ic_launcher_background.xml

          # Adaptive-иконка описывается XML в mipmap-anydpi-v26. Раньше мы
          # надеялись на шаблон Capacitor и просто подменяли PNG — из-за
          # этого foreground-слой мог остаться шаблонным. Теперь пишем XML
          # сами: фон - цвет, поверх - бургер, плюс монохромный слой для
          # тематических иконок Android 13+.
          mkdir -p $RES/mipmap-anydpi-v26
          for name in ic_launcher ic_launcher_round; do
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/ic_launcher_background" />' \
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />' \
              '    <monochrome android:drawable="@mipmap/ic_launcher_monochrome" />' \
              '</adaptive-icon>' \
              > $RES/mipmap-anydpi-v26/$name.xml
          done

          # Шаблон Capacitor может принести свои ic_launcher_foreground.xml
          # (вектор-заглушка). Одноимённый XML перебивает наш PNG, поэтому
          # такие файлы удаляем.
          rm -fv $RES/drawable*/ic_launcher_foreground.xml || true
          rm -fv $RES/drawable*/ic_launcher_background.xml || true

          echo "--- итоговые ресурсы иконки ---"
          ls -la $RES/mipmap-anydpi-v26/ $RES/mipmap-xxxhdpi/
          cat $RES/mipmap-anydpi-v26/ic_launcher.xml
          cat $RES/values/ic_launcher_background.xml

      # Проверяем, что иконка действительно попала в сборку, а не осталась
      # шаблонной. Сравниваем размер с эталоном из репозитория.
      - name: Verify icon installed
        run: |
          A=android-icons/mipmap-xxxhdpi/ic_launcher_foreground.png
          B=android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          if ! cmp -s "$A" "$B"; then
            echo "ОШИБКА: foreground-иконка в проекте не совпадает с эталоном"
            exit 1
          fi
          echo "иконка на месте: $(stat -c%s "$B") Б"

      # Отдельная и ранняя проверка: если секреты забыты, падение следующего
      # шага должно быть объяснимо уже в логе, а не «node exited 1».
      # Секреты читаем через env, а не подстановкой прямо в команду: пароль с
      # кавычкой или скобкой иначе сломал бы весь shell-шаг.
      - name: Are the signing secrets configured
        id: signs
        env:
          CHUB_KEYSTORE_B64: ${{ secrets.CHUB_KEYSTORE_B64 }}
          CHUB_KEYSTORE_PASSWORD: ${{ secrets.CHUB_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$CHUB_KEYSTORE_B64" ] || [ -z "$CHUB_KEYSTORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты подписи не заданы — APK соберётся debug-подписью и в релиз не попадёт. Инструкция: android-signing/README.md"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "секреты подписи на месте"
          fi

      # Постоянный ключ подписи и номер версии. Без постоянного ключа каждая
      # сборка подписывалась бы новым debug-ключом, и Android отказывался бы
      # ставить обновление поверх с ошибкой «конфликт пакетов».
      #
      # КЛЮЧ БЕРЁТСЯ ИЗ SECRETS. В репозитории его больше нет: публичный
      # репозиторий + публичный ключ = любой может подписать свой APK как
      # «обновление CHUBUGAMES» (подробности: android-signing/README.md).
      - name: Configure signing and version
        env:
          CHUB_KEYSTORE_B64: ${{ secrets.CHUB_KEYSTORE_B64 }}
          CHUB_KEYSTORE_PASSWORD: ${{ secrets.CHUB_KEYSTORE_PASSWORD }}
          CHUB_KEY_ALIAS: ${{ secrets.CHUB_KEY_ALIAS }}
          CHUB_KEY_PASSWORD: ${{ secrets.CHUB_KEY_PASSWORD }}
          # Смысл флага: «можно ли продолжать без ключа».
          #   · секреты есть → продолжаем только с настоящей подписью (0),
          #     опечатка в ключе обязана уронить релиз, а не выдать людям
          #     неподписанный файл;
          #   · секретов нет → не падаем: соберётся debug-APK и уедет в
          #     отдельный PRE-RELISE с предупреждением, а канал обновлений
          #     (тег latest) останется нетронутым.
          CHUB_ALLOW_UNSIGNED: ${{ steps.signs.outputs.signed == 'true' && '0' || '1' }}
        run: node scripts/setup-android-signing.mjs "$APP_VER" "${{ github.run_number }}"

      # Плагин фоновой проверки поставляется вместе с нативной библиотекой
      # android-js-engine-release.aar. Без этой строки Gradle её не найдёт
      # и сборка упадёт на «Could not find android-js-engine».
      - name: Wire background runner library
        run: |
          GRADLE=android/app/build.gradle
          if ! grep -q 'background-runner/android/src/main/libs' $GRADLE; then
            sed -i "s|dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'|dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'\n        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'|" $GRADLE
          fi
          echo "--- repositories в app/build.gradle ---"
          sed -n '/repositories/,/}/p' $GRADLE

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Тип сборки зависит от того, что это за прогон:
      #  • РЕЛИЗ (тег v* или dispatch c publish=true) — assembleRelease.
      #    Без секретов CHUB_KEYSTORE_* он не соберётся: неподписанный
      #    release-APK нельзя ни поставить поверх предыдущего, ни отдать
      #    людям как обновление, поэтому скрипт настройки подписи сам
      #    завершает прогон ошибкой.
      #  • ВЕТКА/PR — assembleDebug: быстрая проверка, что сборка жива и
      #    ставится на телефон. Раньше на ветках тоже шёл assembleRelease и
      #    падал он не на полезном, а на имени файла: Gradle кладёт
      #    неподписанный результат в app-release-unsigned.apk.
      #
      # Пароли передаются свойствами Gradle и в git не пишутся.
      - name: Build APK
        env:
          CHUB_KEYSTORE_PASSWORD: ${{ secrets.CHUB_KEYSTORE_PASSWORD }}
          CHUB_KEY_ALIAS: ${{ secrets.CHUB_KEY_ALIAS }}
          CHUB_KEY_PASSWORD: ${{ secrets.CHUB_KEY_PASSWORD }}
        run: |
          cd android
          TASK=assembleDebug
          if [ "${{ steps.kind.outputs.release }}" = "true" ] && [ "${{ steps.signs.outputs.signed }}" = "true" ]; then
            TASK=assembleRelease
          fi
          echo "тип сборки: $TASK"
          ARGS="--no-daemon --stacktrace"
          if [ -n "$CHUB_KEYSTORE_PASSWORD" ]; then
            ARGS="$ARGS -PchubStorePassword=$CHUB_KEYSTORE_PASSWORD"
            ARGS="$ARGS -PchubKeyAlias=${CHUB_KEY_ALIAS:-chubgames}"
            ARGS="$ARGS -PchubKeyPassword=${CHUB_KEY_PASSWORD:-$CHUB_KEYSTORE_PASSWORD}"
          fi
          ./gradlew $TASK $ARGS

      # Ищем результат в обеих папках: путь у Gradle зависит от типа сборки,
      # а следующий шаг (проверка подписи) должен получить файл всегда.
      - name: Rename APK
        run: |
          SRC=$(ls -1t android/app/build/outputs/apk/*/*.apk 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "Gradle не оставил APK. Что есть в outputs:"
            find android/app/build/outputs -maxdepth 3 | sed -n '1,25p'
            exit 1
          fi
          echo "свежий APK: $SRC"
          case "$SRC" in
            *unsigned*)
              # секреты есть, но APK всё равно не подписан — значит сломан
              # сам шаг настройки ключа, и отдавать такое нельзя никому
              echo "::error::APK собран без подписи"
              if [ "${{ steps.signs.outputs.signed }}" = "true" ]; then exit 1; fi
              ;;
          esac
          mv "$SRC" CHUBUGAMES.apk

      # Проверяем подпись ДО публикации: debug-ключ в релизе — это сломанные
      # обновления у всех, кто уже поставил игру, и заметить это постфактум
      # невозможно.
      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs CHUBUGAMES.apk > sig.txt 2>&1 || {
            cat sig.txt; echo "APK не подписан вовсе"; exit 1; }
          cat sig.txt
          if grep -qi "Android Debug" sig.txt; then
            # debug-ключ: в канал обновлений (latest) такой файл не попадает
            # никогда — иначе у всех, кто поставил игру, обновления ломаются.
            # Для preview-релиза это ожидаемый и честно подписанный случай.
            echo "APK подписан DEBUG-ключом — в latest его класть нельзя"
            if [ "${{ steps.kind.outputs.release }}" = "true" ] && [ "${{ steps.signs.outputs.signed }}" = "true" ]; then
              exit 1
            fi
            echo "::warning::в Releases уедет только как preview с предупреждением"
          fi
          sha256sum CHUBUGAMES.apk | tee CHUBUGAMES.apk.sha256

      - name: Upload APK (артефакт сборки)
        uses: actions/upload-artifact@v4
        with:
          name: CHUBUGAMES-APK
          path: |
            CHUBUGAMES.apk
            CHUBUGAMES.apk.sha256
          retention-days: 90

      # Секретов подписи нет, а людям файл нужен уже сейчас. Тогда debug-сборка
      # уезжает в ОТДЕЛЬНЫЙ pre-release с крупным предупреждением, а канал
      # обновлений (тег latest) не трогается вообще: у debug-ключа другая
      # подпись, Android отказался бы ставить такой пакет поверх боевого, а
      # попытка «через удаление» стёрла бы прогресс игрока.
      # Секретов подписи нет, а людям файл нужен уже сейчас. Тогда debug-сборка
      # уезжает в ОТДЕЛЬНЫЙ pre-release с крупным предупреждением, а канал
      # обновлений (тег latest) не трогается вообще: у debug-ключа другая
      # подпись, Android отказался бы ставить такой пакет поверх боевого, а
      # попытка «через удаление» стёрла бы прогресс игрока.
      - name: Publish preview APK (no signing key)
        if: steps.kind.outputs.release == 'true' && steps.signs.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="CHUBUGAMES-$APP_VER-preview.apk"
          cp CHUBUGAMES.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          SIZE=$(du -h "$APK" | cut -f1)
          {
            printf '%s\n\n' "## Это НЕ обновление. Это preview"
            printf '%s\n' "Тот же код, что в теге v$APP_VER, но подписанный отладочным ключом:"
            printf '%s\n\n' "постоянного релизного ключа в Secrets нет, поэтому нормальный APK собрать нечем."
            printf '%s\n' "| Файл | Размер |"
            printf '%s\n' "|---|---|"
            printf '%s\n\n' "| \`$APK\` | $SIZE |"
            printf '%s\n\n' "**Что будет, если поставить**"
            printf '%s\n' "- поверх боевой версии Android откажет: подписи разные;"
            printf '%s\n' "- если удалить текущую версию и поставить эту — прогресс сотрётся, он живёт внутри приложения;"
            printf '%s\n' "- встроенная проверка обновлений эту ветку не видит: она смотрит на тег \`latest\`."
            printf '\n%s\n\n' "Поэтому сначала «Настройки» → «Сохранение» → экспорт файла, потом установка preview, потом импорт."
            printf '%s\n\n' "**Как вернуть нормальный канал (один раз, 5 минут)**"
            printf '%s\n' "1. Значения четырёх секретов лежат в \`android-signing/PASTE-INTO-SECRETS.txt\` (файл в репозитории, самого ключа там нет);"
            printf '%s\n' "2. GitHub → Settings → Secrets and variables → Actions → New repository secret, четыре имени: \`CHUB_KEYSTORE_B64\`, \`CHUB_KEYSTORE_PASSWORD\`, \`CHUB_KEY_ALIAS\`, \`CHUB_KEY_PASSWORD\`;"
            printf '%s\n\n' "3. Re-run failed jobs на этом прогоне: тот же коммит соберётся как \`assembleRelease\`, подпишется и попадёт в \`latest\`."
            printf '%s\n' "\`\`\`"
            cat "$APK.sha256"
            printf '%s\n' "\`\`\`"
          } > PREVIEW_BODY.md
          cat PREVIEW_BODY.md
          # Ошибку gh выводим аннотацией: лог прогона с telefonu не всегда
          # достаён, а предупреждение в аннотациях видно и в UI, и через API.
          if ! gh release create "v$APP_VER-preview" --target "$GITHUB_SHA" --prerelease \
               --title "Android $APP_VER — preview (debug-подпись)" \
               --notes-file PREVIEW_BODY.md 2> gh.err; then
            echo "::error::gh release create: $(tr '\n' '|' < gh.err | cut -c1-400)"
            exit 1
          fi
          if ! gh release upload "v$APP_VER-preview" "$APK" "$APK.sha256" --clobber 2> up.err; then
            echo "::error::gh release upload: $(tr '\n' '|' < up.err | cut -c1-400)"
            exit 1
          fi
          echo "::warning::Секретов подписи нет — в Releases лёг только preview, latest не тронут"

      - name: Upload APK (артефакт сборки)
        uses: actions/upload-artifact@v4
        with:
          name: CHUBUGAMES-APK
          path: |
            CHUBUGAMES.apk
            CHUBUGAMES.apk.sha256
          retention-days: 90

      # Секретов подписи нет, а людям файл нужен уже сейчас. Тогда debug-сборка
      # уезжает в ОТДЕЛЬНЫЙ pre-release с крупным предупреждением, а канал
      # обновлений (тег latest) не трогается вообще: у debug-ключа другая
      # подпись, Android отказался бы ставить такой пакет поверх боевого, а
      # попытка «через удаление» стёрла бы прогресс игрока.
      - name: Publish preview APK (no signing key)
        if: steps.kind.outputs.release == 'true' && steps.signs.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp CHUBUGAMES.apk "CHUBUGAMES-$APP_VER-preview.apk"
          sha256sum "CHUBUGAMES-$APP_VER-preview.apk" > "CHUBUGAMES-$APP_VER-preview.apk.sha256"
          {
            printf '## Это НЕ обновление. Это preview\n\n'
            printf 'Тот же код, что в теге `v%s`, но подписанный **отладочным** ключом:\n' "$APP_VER"
            printf 'постоянного релизного ключа в Secrets нет, поэтому нормальный APK\n'
            printf 'собрать нечем.\n\n'
            printf '| Файл | Размер |\n|---|---|\n'
            printf '| `CHUBUGAMES-%s-preview.apk` | %s |\n\n' "$APP_VER" "$(du -h "CHUBUGAMES-$APP_VER-preview.apk" | cut -f1)"
            printf '**Что будет, если поставить:**\n'
            printf('- поверх боевой версии Android откажет: подписи разные;\n')
            printf('- если удалить текущую версию и поставить эту — прогресс сотрётся\n')
            x. Сначала «Настройки» → «Сохранение» →\n')
            printf('  экспорт файла, потом обратно после установки;\n')
            printf('- встроенная проверка обновлений эту ветку не видит: она смотрит на\n')
            printf('  тег `latest`, поэтому встроенные обновления приходить не будут.\n\n')
            printf '**Как выпустить нормальную сборку (5 минут, один раз):**\n')
            printf('1. Значения четырёх секретов лежат в `android-signing/PASTE-INTO-SECRETS.txt` (файл в репо, ключа в репо нет).\n')
            printf('2. GitHub → Settings → Secrets and variables → Actions → New repository secret, четыре имени:\n')
            printf('   `CHUB_KEYSTORE_B64`, `CHUB_KEYSTORE_PASSWORD`, `CHUB_KEY_ALIAS`, `CHUB_KEY_PASSWORD`.\n')
            printf('3. Перезапустить этот прогон (Re-run failed jobs) — тот же коммит соберётся `assembleRelease`,\n')
            printf('   подпишется и попадёт в `latest`.\n\n')
            printf '```\n'; cat "CHUBUGAMES-$APP_VER-preview.apk.sha256"; printf '\n```\n'
          } > PREVIEW_BODY.md
          gh release create "v$APP_VER-preview" --target "$GITHUB_SHA" --prerelease \
            --title "Android $APP_VER — preview (debug-подпись)" --notes-file PREVIEW_BODY.md \
            "CHUBUGAMES-$APP_VER-preview.apk" "CHUBUGAMES-$APP_VER-preview.apk.sha256"
          echo "::warning::Секретов подписи нет — в Releases лёг только preview (pre-release), latest не тронут"

      # Кладём APK в Releases — прямая ссылка на скачивание с телефона,
      # без ZIP-архива и без входа в аккаунт GitHub
      # Описание релиза держим коротким и техническим: подробный список
      # изменений человек читает ВНУТРИ приложения (экран «Что нового»),
      # дублировать его целиком на странице релиза незачем.
      - name: Prepare release notes
        if: steps.kind.outputs.release == 'true' && steps.signs.outputs.signed == 'true'
        run: |
          {
            printf 'version: %s\n\n' "$APP_VER"
            printf '**CHUBUGAMES %s — Android 7.0+**\n\n' "$APP_VER"
            printf '| Файл | Размер |\n'
            printf '|---|---|\n'
            printf '| `CHUBUGAMES.apk` | %s |\n\n' "$(du -h CHUBUGAMES.apk | cut -f1)"
            printf 'Установка поверх предыдущей версии сохраняет прогресс. Список изменений — в приложении: «Настройки» → «Что нового».\n\n'
            printf '**Play Protect.** Сборка распространяется вне Google Play. При установке система может показать предупреждение — это реакция на источник, а не на содержимое файла.\n\n'
            printf '**Проверка файла.** Приложение сверяет контрольную сумму само, но её можно проверить и руками:\n\n'
            printf '```\n'
            cat CHUBUGAMES.apk.sha256
            printf '```\n'
          printf '\n---\n\n'
          printf 'Собрано: %s · коммит `%s` · сборка #%s в GitHub Actions. Если на странице релиза дата «released this» старее — это дата создания самого релиза, она не пересоздаётся; ориентируйся на эту строку и на SHA-256 выше.\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_SHA:0:7}" "$GITHUB_RUN_NUMBER"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      # Причина та же, что в build-desktop.yml: gh вместо action-gh-release.
      - name: Publish APK to Releases
        if: steps.kind.outputs.release == 'true' && steps.signs.outputs.signed == 'true'
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --latest --title "Android-сборка $APP_VER" --notes-file RELEASE_BODY.md
          else
            gh release edit latest --title "Android-сборка $APP_VER" --notes-file RELEASE_BODY.md --latest
          fi
          gh release upload latest CHUBUGAMES.apk CHUBUGAMES.apk.sha256 --clobber
          echo "--- что теперь лежит в релизе latest ---"
          gh release view latest --json assets -q '.assets[].name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Плавающий тег — это не про историю, а про «что выложено прямо сейчас».
      # Теги desktop/latest были созданы на коммите мая и с тех пор не
      # двигались: страница релиза выглядела как древняя сборка (в шапке дата
      # прошлого выпуска и майский коммит), а «Source code (zip/tar.gz)» качал
      # исходники не того, из чего собран этот exe. Двигаем тег на коммит
      # прогона — тогда и архивы, и «Compare», и шапка соответствуют файлу.
      #
      # Дату «released this» специально не подделываем: переход draft → published
      # через gh release edit published_at не обновляет (проверено на черновом
      # релизе), а риск остаться в состоянии draft — это 404 для всех, кто качает.
      # Актуальность сборки видна по строке «Собрано: …» в теле релиза.
      - name: Point the floating tag at the built commit
        if: steps.kind.outputs.release == 'true' && steps.signs.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
               -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/latest" -f sha="$GITHUB_SHA"
          fi
          echo "тег latest -> $GITHUB_SHA"
          # Знак «Latest» на странице релизов сознательно держится за Android:
          # тег latest — это ещё и точка, куда смотрит встроенная проверка
          # обновлений на телефоне. Без явного флага GitHub отдаёт бейдж тому
          # релизу, который последним вышел из draft, — и он однажды уехал на
          # ПК-сборку.
          gh release edit latest --title "Android-сборка $APP_VER" --target "$GITHUB_SHA" --latest
      # Тег latest остаётся точкой публикации: на него ведут ссылка внутри
      # самого приложения (updater спрашивает releases/tags/latest), ссылки в
      # README и закладки тех, кто качал игру раньше. Меняется только то, что
      # в нём лежит, — и только на релизном прогоне, а не на любом пуше.
      #
      # Старый файл назывался CHUBGAMES.apk — без «U», то есть не совпадал с
      # названием игры. Он висит в релизе до сих пор, и человек мог скачать
      # именно его: устаревшую версию, которая потом не обновляется. Удаляем
      # ПОСЛЕ загрузки нового, иначе при падении публикации latest останется
      # вообще без файла и ссылка скачивания станет 404.
      - name: Remove the misspelled legacy asset
        if: steps.kind.outputs.release == 'true' && steps.signs.outputs.signed == 'true'
        run: gh release delete-asset latest CHUBGAMES.apk -y || echo "старого файла уже нет — ок"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
