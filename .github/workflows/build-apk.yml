name: Build CHUBGAMES APK

on:
  push:
    branches: [main, master, "arena/**"]
  workflow_dispatch:

# нужно для публикации APK в Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app (single offline HTML)
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Capacitor 7 -> compileSdk 35 / AGP 8.7.2 (Capacitor 8 требует SDK 36 и падает на раннере)
      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Initialize Capacitor
        run: npx cap init "CHUBGAMES" "com.chubgames.app" --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android app (portrait, offline)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Игра портретная
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' $MANIFEST
          # Вибрация для хаптики
          sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          # Приложение полностью автономно — интернет не нужен
          sed -i '/android.permission.INTERNET/d' $MANIFEST
          echo "--- AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Set app label
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">CHUBGAMES</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">CHUBGAMES</string>|' android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      # Ставим иконку приложения. Готовые PNG лежат в репозитории (android-icons/),
      # поэтому сборка не зависит от скачивания доп. пакетов.
      - name: Install app icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -v android-icons/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          # фон adaptive-иконки: белый -> тёмный, под стиль приложения
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#0D0D10</color>' \
            '</resources>' \
            > android/app/src/main/res/values/ic_launcher_background.xml
          echo "--- итоговый фон иконки ---"
          cat android/app/src/main/res/values/ic_launcher_background.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk CHUBGAMES.apk

      - name: Upload APK (артефакт сборки)
        uses: actions/upload-artifact@v4
        with:
          name: CHUBGAMES-APK
          path: CHUBGAMES.apk
          retention-days: 90

      # Кладём APK в Releases — прямая ссылка на скачивание с телефона,
      # без ZIP-архива и без входа в аккаунт GitHub
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CHUBGAMES — последняя сборка
          body: |
            ## 🍔 CHUBGAMES

            Оффлайн-приложение с мини-играми про друзей. Интернет не нужен.

            ### Установка
            1. Скачай **CHUBGAMES.apk** ниже (прямо с телефона)
            2. Открой файл — Android спросит разрешение на установку
            3. Разреши установку из этого источника и жми «Установить»

            Если Android ругается «Play Защита» — жми «Всё равно установить».
            Это нормально для APK, собранных не через Google Play.

            ---
            Собрано автоматически из ветки `${{ github.ref_name }}`
            · коммит `${{ github.sha }}`
          files: CHUBGAMES.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
