name: Build CHUBGAMES APK

on:
  push:
    branches: [main, master, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app (single offline HTML)
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Capacitor 7 -> compileSdk 35 / AGP 8.7.2 (Capacitor 8 требует SDK 36 и падает на раннере)
      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Initialize Capacitor
        run: npx cap init "CHUBGAMES" "com.chubgames.app" --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android app (portrait, offline)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Игра портретная
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' $MANIFEST
          # Вибрация для хаптики
          sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          # Приложение полностью автономно — интернет не нужен
          sed -i '/android.permission.INTERNET/d' $MANIFEST
          echo "--- AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Set app label
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">CHUBGAMES</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">CHUBGAMES</string>|' android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk CHUBGAMES.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHUBGAMES-APK
          path: CHUBGAMES.apk
          retention-days: 90
