name: Build CHUBGAMES APK

on:
  push:
    branches: [main, master, "arena/**"]
  workflow_dispatch:

# нужно для публикации APK в Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app (single offline HTML)
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Capacitor 7 -> compileSdk 35 / AGP 8.7.2 (Capacitor 8 требует SDK 36 и падает на раннере)
      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Initialize Capacitor
        run: npx cap init "CHUBGAMES" "com.chubgames.app" --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android app (portrait, offline)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Игра портретная
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' $MANIFEST
          # Вибрация для хаптики
          sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          # Установка обновлений прямо из приложения
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' $MANIFEST
          # Интернет нужен ТОЛЬКО для скачивания обновления; сами игры работают офлайн
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          echo "--- AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Read app version
        run: |
          VER=$(node -p "require('fs').readFileSync('src/core/version.ts','utf8').match(/APP_VERSION\s*=\s*\"([0-9.]+)\"/)[1]")
          echo "APP_VER=$VER" >> $GITHUB_ENV
          echo "Версия приложения: $VER (сборка ${{ github.run_number }})"

      - name: Set app label
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">ЧУБУГЕЙМ</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">ЧУБУГЕЙМ</string>|' android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      # Ставим иконку приложения. Готовые PNG лежат в репозитории (android-icons/),
      # поэтому сборка не зависит от скачивания доп. пакетов.
      - name: Install app icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -v android-icons/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          # фон adaptive-иконки: белый -> тёмный, под стиль приложения
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#0D0D10</color>' \
            '</resources>' \
            > android/app/src/main/res/values/ic_launcher_background.xml
          echo "--- итоговый фон иконки ---"
          cat android/app/src/main/res/values/ic_launcher_background.xml

      # Постоянный ключ подписи и номер версии. Без постоянного ключа каждая
      # сборка подписывалась бы новым debug-ключом, и Android отказывался бы
      # ставить обновление поверх с ошибкой «конфликт пакетов».
      - name: Configure signing and version
        run: node scripts/setup-android-signing.mjs "$APP_VER" "${{ github.run_number }}"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk CHUBGAMES.apk

      - name: Upload APK (артефакт сборки)
        uses: actions/upload-artifact@v4
        with:
          name: CHUBGAMES-APK
          path: CHUBGAMES.apk
          retention-days: 90

      # Кладём APK в Releases — прямая ссылка на скачивание с телефона,
      # без ZIP-архива и без входа в аккаунт GitHub
      - name: Prepare release notes
        run: |
          {
            printf 'version: %s\n\n' "$APP_VER"
            cat RELEASE_NOTES.md
            printf '\n---\n'
            printf 'Собрано автоматически из ветки `%s`\n' "$GITHUB_REF_NAME"
            printf '· коммит `%s`\n' "$GITHUB_SHA"
          } > RELEASE_BODY.md

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ЧУБУГЕЙМ — последняя сборка
          body_path: RELEASE_BODY.md
          files: CHUBGAMES.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
