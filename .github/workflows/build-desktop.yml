name: Build Desktop (Windows EXE)

on:
  push:
    branches: [main, master, "arena/**"]
  workflow_dispatch:

# нужно для публикации сборок в Releases
permissions:
  contents: write

jobs:
  build:
    # Собираем НА WINDOWS: так .exe получается нативно, без wine,
    # и подпись/иконка проставляются корректно.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app (single offline HTML)
        run: npm run build

      - name: Read app version
        shell: bash
        run: |
          VER=$(node -p "require('fs').readFileSync('src/core/version.ts','utf8').match(/APP_VERSION\s*=\s*\"([0-9.]+)\"/)[1]")
          echo "APP_VER=$VER" >> $GITHUB_ENV
          echo "Версия приложения: $VER"

      # Версия в package.json задаёт имя файлов сборки — синхронизируем
      # её с той, что показывает само приложение.
      - name: Sync package version
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version=process.env.APP_VER;
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          node -p "'package.json version -> '+require('./package.json').version"

      - name: Build Windows EXE
        run: npx electron-builder --config desktop/builder.yml --win --publish never

      - name: List artifacts
        shell: bash
        run: ls -la desktop-out/ || true

      # Раньше .exe собирался «успешно», но при запуске показывал пустое
      # окно: оболочка и игра не попадали внутрь архива app.asar.
      # Скрипт распаковывает пакет и проверяет состав (пути внутри asar
      # на Windows идут с обратным слэшем — сравнение нормализованное).
      - name: Verify app contents inside asar
        shell: bash
        run: node scripts/verify-asar.mjs desktop-out/win-unpacked/resources/app.asar

      # Запускаем собранное приложение вживую и убеждаемся, что окно
      # действительно отрисовалось, а не упало на старте.
      - name: Smoke test (запуск приложения)
        shell: pwsh
        run: |
          $exe = "desktop-out/win-unpacked/CHUBGAMES.exe"
          if (-not (Test-Path $exe)) { Write-Error "нет $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "Приложение упало сразу после запуска, код выхода $($p.ExitCode)"
            exit 1
          }
          $p.Refresh()
          Write-Host "процесс жив, заголовок окна: '$($p.MainWindowTitle)'"
          if ([string]::IsNullOrEmpty($p.MainWindowTitle)) {
            Write-Error "Окно не появилось — приложение запускается, но ничего не показывает"
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Приложение запустилось и показало окно."

      # Проверяем, что оба файла реально собрались и не пустые
      - name: Verify build
        shell: bash
        run: |
          PORT="desktop-out/CHUBGAMES-${APP_VER}-portable.exe"
          SETUP="desktop-out/CHUBGAMES-${APP_VER}-setup.exe"
          for f in "$PORT" "$SETUP"; do
            if [ ! -f "$f" ]; then
              echo "ОШИБКА: не собрался $f"
              ls -la desktop-out/
              exit 1
            fi
            SZ=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f -> $SZ Б"
            if [ "$SZ" -lt 40000000 ]; then
              echo "ОШИБКА: $f подозрительно маленький — вероятно, игра не попала внутрь"
              exit 1
            fi
          done

      - name: Upload EXE (артефакт сборки)
        uses: actions/upload-artifact@v4
        with:
          name: CHUBGAMES-Windows
          path: |
            desktop-out/*.exe
          retention-days: 90

      - name: Prepare release notes
        shell: bash
        run: |
          {
            printf 'version: %s\n\n' "$APP_VER"
            printf '## ЧУБУГЕЙМ для компьютера — Windows 10/11, 64-бит\n\n'
            printf '### Какой файл качать\n\n'
            printf '| | Что делает | Кому |\n'
            printf '|---|---|---|\n'
            printf '| **CHUBGAMES-%s-setup.exe** | Устанавливает игру: ярлык на рабочем столе и в «Пуске», запись в «Установка и удаление программ». Обновляется одной кнопкой внутри игры | **Бери этот, если не уверен** |\n' "$APP_VER"
            printf '| **CHUBGAMES-%s-portable.exe** | Ничего не устанавливает — просто запускается. Живёт одним файлом, можно носить на флешке | Если не хочешь ставить программу в систему |\n\n' "$APP_VER"
            printf 'Игра внутри **одинаковая**. Разница только в способе установки. Сохранения у них раздельные.\n\n'
            printf '### Синее окно Windows при запуске\n\n'
            printf 'Скорее всего увидишь «Система Windows защитила ваш компьютер». Нажми **«Подробнее» → «Выполнить в любом случае»**.\n\n'
            printf 'Почему так и почему могло не быть раньше:\n\n'
            printf '* SmartScreen считает репутацию **по хешу конкретного файла**. У неподписанных программ репутация не переносится между версиями — каждая новая сборка начинает с нуля.\n'
            printf '* То есть предупреждение будет появляться на **каждом** новом релизе, даже если предыдущий его уже не показывал. Это не значит, что с файлом что-то не так.\n'
            printf '* Убрать это может только сертификат подписи разработчика (от 99 долларов в год) — и то не сразу: Microsoft в 2024 году отменил мгновенную репутацию даже для дорогих EV-сертификатов.\n\n'
            printf 'Проверить, что файл не подменили, можно по хешу SHA-256 — он ниже.\n\n'
            printf '### Что нового\n\n'
            printf 'Окно растягивается на весь монитор, есть выбор разрешения и режимов экрана, полный экран по F11 и обновление прямо из программы (Настройки → Компьютер).\n\n'
            printf 'Управление мышью. Escape — назад, F11 — полный экран, Ctrl и +/- — масштаб.\n\n'
            printf 'Игра работает полностью офлайн. С телефоном прогресс не синхронизируется — переносится файлом сохранения через настройки.\n\n'
            printf '### SHA-256\n\n'
            printf '```\n'
            ( cd desktop-out && sha256sum *.exe ) || true
            printf '```\n\n'
            printf -- '---\n'
            printf 'Собрано автоматически из ветки `%s`, коммит `%s`\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
          } > DESKTOP_BODY.md
          cat DESKTOP_BODY.md

      # Старые сборки накапливались в релизе: после пяти версий там лежало
      # десять файлов, и было неочевидно, какой качать. Оставляем только
      # текущую версию.
      #
      # ВНИМАНИЕ: этот шаг однажды был потерян при переписывании соседнего
      # шага срезом по индексам строк — если правишь блок ниже, проверь,
      # что он на месте (в check-ui есть проверка).
      - name: Remove outdated assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view desktop --json assets -q '.assets[].name' 2>/dev/null | while read -r a; do
            case "$a" in
              *"$APP_VER"*) echo "оставляем $a" ;;
              *.exe) echo "удаляем устаревший $a"; gh release delete-asset desktop "$a" -y || true ;;
            esac
          done

      - name: Publish EXE to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: ЧУБУГЕЙМ для ПК — последняя сборка
          body_path: DESKTOP_BODY.md
          files: desktop-out/*.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
