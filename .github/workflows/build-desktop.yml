name: Build Desktop (Windows EXE)

# См. комментарий в build-apk.yml: проверка и публикация разделены.
# Пуш в ветку — только проверка и артефакт; релиз — тег v<версия> или
# ручной запуск с флагом publish.
on:
  push:
    branches: [CHUBUGAMES, main, master, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить EXE в Releases"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build web app
        run: npm run build
      - name: UI contract checks
        run: npm run check:ui
      - name: Key files parse
        run: node --check desktop/main.cjs && node --check desktop/preload.cjs

  build:
    needs: verify
    # Собираем НА WINDOWS: так .exe получается нативно, без wine,
    # и подпись/иконка проставляются корректно.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (single offline HTML)
        run: npm run build

      - name: Read app version
        shell: bash
        run: |
          VER=$(node -p "require('fs').readFileSync('src/core/version.ts','utf8').match(/APP_VERSION\\s*=\\s*\\\"([0-9.]+)\\\"/)[1]")
          echo "APP_VER=$VER" >> $GITHUB_ENV
          echo "Версия приложения: $VER"

      # Версия в package.json задаёт имя файлов сборки — она обязана
      # совпадать с той, что показывает приложение: из package.json её
      # берёт Electron (app.getVersion), и по ней же проверка обновлений
      # решает, есть ли что ставить. Расхождение = «вечное обновление».
      - name: Sync package version
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            if (p.version === process.env.APP_VER) { console.log('package.json уже актуален: '+p.version); process.exit(0); }
            console.log('::warning::package.json '+p.version+' != '+process.env.APP_VER+' — правь файл в репозитории, а не CI');
            p.version=process.env.APP_VER;
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          node -p "'package.json version -> '+require('./package.json').version"

      - name: Tag matches the app version
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$APP_VER" ]; then
            echo "Тег v$TAG, а в src/core/version.ts — $APP_VER"; exit 1
          fi

      - name: Decide what this run is
        id: kind
        shell: bash
        run: |
          REL=false
          case "$GITHUB_REF" in
            refs/tags/v*) REL=true ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            REL=true
          fi
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "Режим: $([ "$REL" = true ] && echo 'РЕЛИЗ' || echo 'проверка (только артефакт)')"

      - name: Build Windows EXE
        run: npx electron-builder --config desktop/builder.yml --win --publish never

      - name: List artifacts
        shell: bash
        run: ls -la desktop-out/ || true

      # Раньше .exe собирался «успешно», но при запуске показывал пустое
      # окно: оболочка и игра не попадали внутрь архива app.asar.
      # Скрипт распаковывает пакет и проверяет состав (пути внутри asar
      # на Windows идут с обратным слэшем — сравнение нормализованное).
      - name: Verify app contents inside asar
        shell: bash
        run: node scripts/verify-asar.mjs desktop-out/win-unpacked/resources/app.asar

      # Запускаем собранное приложение вживую и убеждаемся, что окно
      # действительно отрисовалось, а не упало на старте.
      - name: Smoke test (запуск приложения)
        shell: pwsh
        run: |
          # Имя exe берём из папки, а не хардкодим: оно зависит от
          # productName и однажды уже разъехалось при переименовании.
          $exe = (Get-ChildItem "desktop-out/win-unpacked/*.exe" | Select-Object -First 1).FullName
          if (-not $exe) {
            Write-Error "в win-unpacked нет ни одного .exe"
            Get-ChildItem "desktop-out/win-unpacked" | Format-Table Name
            exit 1
          }
          Write-Host "запускаю $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "Приложение упало сразу после запуска, код выхода $($p.ExitCode)"
            exit 1
          }
          $p.Refresh()
          Write-Host "процесс жив, заголовок окна: '$($p.MainWindowTitle)'"
          if ([string]::IsNullOrEmpty($p.MainWindowTitle)) {
            Write-Error "Окно не появилось — приложение запускается, но ничего не показывает"
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Приложение запустилось и показало окно."

      # Проверяем, что оба файла реально собрались и не пустые
      - name: Verify build
        shell: bash
        run: |
          PORT="desktop-out/CHUBUGAMES-${APP_VER}-portable.exe"
          SETUP="desktop-out/CHUBUGAMES-${APP_VER}-setup.exe"
          for f in "$PORT" "$SETUP"; do
            if [ ! -f "$f" ]; then
              echo "ОШИБКА: не собрался $f"
              ls -la desktop-out/
              exit 1
            fi
            SZ=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f -> $SZ Б"
            if [ "$SZ" -lt 40000000 ]; then
              echo "ОШИБКА: $f подозрительно маленький — вероятно, игра не попала внутрь"
              exit 1
            fi
          done

      # Хеши считаем ОДИН раз и складываем в файл: он уходит и в описание
      # релиза, и как отдельный ассет. Приложение сверяет по нему скачанный
      # файл перед запуском установщика.
      - name: Checksums
        shell: bash
        run: |
          ( cd desktop-out && sha256sum *.exe > checksums.sha256 )
          cat desktop-out/checksums.sha256

      - name: Upload EXE (артефакт сборки)
        uses: actions/upload-artifact@v4
        with:
          name: CHUBUGAMES-Windows
          path: |
            desktop-out/*.exe
            desktop-out/checksums.sha256
          retention-days: 90

      - name: Prepare release notes
        shell: bash
        run: |
          {
            printf 'version: %s\n\n' "$APP_VER"
            printf '**CHUBUGAMES %s — Windows 10/11 x64**\n\n' "$APP_VER"
            printf '| Файл | Тип |\n'
            printf '|---|---|\n'
            printf '| `CHUBUGAMES-%s-setup.exe` | Установщик. Ярлык, запись в «Программы», обновление из приложения |\n' "$APP_VER"
            printf '| `CHUBUGAMES-%s-portable.exe` | Без установки. Один файл |\n\n' "$APP_VER"
            printf 'Содержимое сборок идентично. Данные сохраняются раздельно.\n\n'
            printf '**SmartScreen.** Сборка не подписана сертификатом. Windows покажет предупреждение при первом запуске: «Подробнее» → «Выполнить в любом случае». Репутация SmartScreen считается по хешу файла и не наследуется между версиями.\n\n'
            printf '**Проверка файла.** Игра сверяет SHA-256 сама перед запуском установщика. Проверить можно и руками — содержимое `checksums.sha256`:\n\n'
            printf '```\n'
            cat desktop-out/checksums.sha256
            printf '```\n'
          } > DESKTOP_BODY.md
          cat DESKTOP_BODY.md

      # Публикуем самим gh, а не сторонним action: в прогоне из тега шаг с
      # softprops/action-gh-release падал с exit 1 без внятного сообщения
      # (он пытался привести к согласию уже существующий релиз desktop и
      # тег, из которого запущен прогон). gh делает ровно то, что написано,
      # и ошибку печатает текстом, а не «Process completed».
      - name: Publish EXE to Releases
        if: steps.kind.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view desktop >/dev/null 2>&1; then
            gh release create desktop --title "PC-сборка $APP_VER" --notes-file DESKTOP_BODY.md
          else
            gh release edit desktop --title "PC-сборка $APP_VER" --notes-file DESKTOP_BODY.md
          fi
          gh release upload desktop desktop-out/*.exe desktop-out/checksums.sha256 --clobber
          echo "--- что теперь лежит в релизе desktop ---"
          gh release view desktop --json assets -q '.assets[].name'

      # Плавающий тег — это не про историю, а про «что выложено прямо сейчас».
      # Теги desktop/latest когда-то были созданы на коммите мая и с тех пор
      # не двигались, поэтому страница релиза выглядела как старая сборка:
      # в шапке «released this …» дата прошлого выпуска, рядом показан коммит
      # семимесячной давности, а «Source code (zip/tar.gz)» качал исходники не
      # того, из чего собран этот exe. Двигаем тег на коммит прогона и
      # возвращаем релизу актуальную дату публикации: GitHub считает
      # «published» по переходу из draft, сама она не обновится.
      - name: Point the floating tag at the built commit
        if: steps.kind.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/desktop" \
               -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/desktop" -f sha="$GITHUB_SHA"
          fi
          echo "тег desktop -> $GITHUB_SHA"
          gh release edit desktop --draft=true --title "PC-сборка $APP_VER"
          gh release edit desktop --draft=false --title "PC-сборка $APP_VER"


      # Устаревшие exe удаляем ПОСЛЕ загрузки новых: если почистить заранее,
      # а публикация упадёт, в релизе не останется вообще ничего и ссылка
      # скачивания у всех станет 404. Оставляем только текущую версию.
      #
      # ВНИМАНИЕ: этот шаг однажды был потерян при переписывании соседнего
      # шага срезом по индексам строк — если правишь блок ниже, проверь,
      # что он на месте (в check-ui есть проверка).
      - name: Remove outdated assets
        if: steps.kind.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view desktop --json assets -q '.assets[].name' 2>/dev/null | while read -r a; do
            case "$a" in
              *"$APP_VER"*) echo "оставляем $a" ;;
              *.exe) echo "удаляем устаревший $a"; gh release delete-asset desktop "$a" -y || true ;;
            esac
          done


