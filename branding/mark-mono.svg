<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Монохромный слой: Android перекрашивает его цветом темы, поэтому здесь
       только форма и лёгкая недобитость тонов — слои не должны слиться.
       Генерится из logo.svg вместе с остальными слоями. -->
  <g>
    <!-- верхняя булочка: купол с прямой подошвой -->
    <path d="M104 214v-10c0-62 68-104 152-104s152 42 152 104v10c0 11-9 20-20 20H124c-11 0-20-9-20-20Z" fill="#ffffff"/>
    <!-- блик по куполу -->
    <path d="M138 154c24-26 60-40 98-40-34 14-60 34-78 58-10 14-24 12-26-4-1-6 1-11 6-14Z" fill="#000000" fill-opacity="0.16"/>
    <!-- кунжут: 5 семечек, развёрнутых веером -->
    <g fill="#000000" fill-opacity="0.16">
      <ellipse cx="176" cy="180" rx="16" ry="9" transform="rotate(-16 176 180)"/>
      <ellipse cx="240" cy="156" rx="16" ry="9" transform="rotate(-5 240 156)"/>
      <ellipse cx="306" cy="164" rx="16" ry="9" transform="rotate(9 306 164)"/>
      <ellipse cx="352" cy="192" rx="15" ry="8.5" transform="rotate(17 352 192)"/>
      <ellipse cx="270" cy="196" rx="15" ry="8.5" transform="rotate(3 270 196)"/>
    </g>

    <!-- салат: тонкая волнистая полоска, видна только крупно -->
    <path d="M108 236h296c0 16-14 26-30 26H138c-16 0-30-10-30-26Z" fill="#ffffff"/>
    <path d="M108 238c22 14 40-8 62 4s38-10 60 2 40-10 62 2 38-8 58 4c14 8 26 2 34-6-8 20-24 30-44 30H140c-20 0-34-14-32-36Z" fill="#ffffff"/>

    <!-- сыр: широкая лента с тремя потёками -->
    <path d="M116 262h280c8 0 12 6 10 13l-10 34c-3 10-16 12-22 3l-12-18-16 30c-4 8-16 8-20 0l-14-26-18 32c-4 8-16 8-20-1l-12-24-16 26c-5 9-18 8-22-2l-8-20-14 22c-5 9-18 8-22-2l-8-20-12 16c-6 9-19 8-22-2l-8-28c-2-7 2-13 10-13Z" fill="#ffffff"/>

    <!-- котлета: толстый брусок с верхней подсветкой -->
    <rect x="122" y="310" width="268" height="46" rx="23" fill="#ffffff"/>
    <rect x="136" y="316" width="240" height="9" rx="4.5" fill="#000000" fill-opacity="0.16"/>

    <!-- нижняя булочка -->
    <path d="M126 362h260c11 0 20 9 20 20 0 24-22 40-52 40H158c-30 0-52-16-52-40 0-11 9-20 20-20Z" fill="#ffffff"/>
    <path d="M148 372c34 10 156 10 200 0-6 14-40 22-100 22s-96-8-100-22Z" fill="#000000" fill-opacity="0.16"/>
  </g>
</svg>
